<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#04070e" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c9a7" />
      <stop offset="50%" stop-color="#1a73e8" />
      <stop offset="100%" stop-color="#f4a623" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#090e17" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Topographic Contour Lines -->
  <g opacity="0.18" stroke="#00c9a7" stroke-width="2" fill="none">
    <path d="M-50,100 C200,40 400,180 700,90 C1000,0 1150,120 1300,60" />
    <path d="M-50,220 C220,130 450,320 750,180 C1020,80 1180,240 1300,160" />
    <path d="M-50,340 C250,230 480,450 800,280 C1050,170 1200,360 1300,260" />
    <path d="M-50,460 C280,330 520,580 850,380 C1080,260 1220,480 1300,360" />
    <circle cx="1050" cy="140" r="180" stroke="#1a73e8" stroke-dasharray="8 8" />
    <circle cx="1050" cy="140" r="320" stroke="#00c9a7" stroke-dasharray="4 8" opacity="0.5" />
  </g>

  <!-- Accent Top Glow Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#tealGrad)" />

  <!-- The Digital Visiting Card Frame in Center -->
  <g transform="translate(150, 75)">
    <!-- Outer Glow -->
    <rect x="-8" y="-8" width="916" height="496" rx="36" fill="none" stroke="#00c9a7" stroke-width="2" opacity="0.3" filter="url(#glow)" />
    
    <!-- Card Body -->
    <rect x="0" y="0" width="900" height="480" rx="32" fill="url(#cardGrad)" stroke="#00c9a7" stroke-width="3" stroke-opacity="0.6" />
    
    <!-- Card Top Accent Strip -->
    <rect x="0" y="0" width="900" height="6" rx="3" fill="url(#tealGrad)" />

    <!-- Top Left: Logo & Company Name -->
    <g transform="translate(50, 45)">
      <!-- Hexagon / Square Logo Box -->
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#00c9a7" fill-opacity="0.15" stroke="#00c9a7" stroke-width="2" />
      <text x="28" y="38" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#00c9a7" text-anchor="middle">SC</text>
      
      <text x="75" y="28" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="3">SPATIO<tspan fill="#00c9a7">CORE</tspan> TECH</text>
      <text x="75" y="48" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="2">OFFICIAL DIGITAL VCARD · VERIFIED</text>
    </g>

    <!-- Top Right: Verified Badge -->
    <g transform="translate(680, 48)">
      <rect x="0" y="0" width="170" height="36" rx="10" fill="#00c9a7" fill-opacity="0.15" stroke="#00c9a7" stroke-width="1.5" />
      <circle cx="20" cy="18" r="5" fill="#00c9a7" />
      <text x="35" y="23" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#00c9a7" letter-spacing="1.5">VERIFIED ID</text>
    </g>

    <!-- Center: Executive Name & Title -->
    <g transform="translate(50, 185)">
      <text x="0" y="40" font-family="'Orbitron', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">SPATIOCORE EXECUTIVE</text>
      <text x="0" y="80" font-family="'DM Sans', sans-serif" font-size="24" font-weight="700" fill="#00c9a7" letter-spacing="1">Executive Leadership &amp; Geospatial Solutions</text>
      <text x="0" y="115" font-family="'Fira Code', monospace" font-size="16" fill="#cbd5e1" letter-spacing="1">Earth Observation · Remote Sensing · Web GIS Intelligence</text>
    </g>

    <!-- Bottom Contact Strip -->
    <line x1="50" y1="360" x2="850" y2="360" stroke="#334155" stroke-width="1.5" />
    <g transform="translate(50, 395)">
      <text x="0" y="18" font-family="'Fira Code', monospace" font-size="15" font-weight="700" fill="#00c9a7">☎ +92 326 5702803</text>
      <text x="240" y="18" font-family="'Fira Code', monospace" font-size="15" fill="#e2e8f0">✉ Insights.spatiocoretech@outlook.com</text>
      <text x="650" y="18" font-family="'Fira Code', monospace" font-size="15" font-weight="700" fill="#f4a623">◎ spatiocore.com</text>
    </g>
  </g>
</svg>
