<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c9a7"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4a623"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(0, 201, 167, 0.25)"/>
      <stop offset="100%" stop-color="rgba(0, 201, 167, 0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 201, 167, 0.08)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(0, 201, 167, 0.2)"/>
    </pattern>
  </defs>

  <!-- Deep space background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Topographic Contour Lines -->
  <g fill="none" stroke="rgba(0, 201, 167, 0.22)" stroke-width="1.5">
    <path d="M-50,150 Q200,80 500,160 T1100,120 T1300,180" />
    <path d="M-50,230 Q250,140 550,240 T1150,190 T1300,260" />
    <path d="M-50,320 Q300,210 620,330 T1180,270 T1300,350" />
    <path d="M-50,420 Q350,300 700,430 T1200,370 T1300,440" />
    <path d="M-50,510 Q400,390 780,520 T1220,460 T1300,530" />
  </g>

  <!-- Satellite Orbit Accents -->
  <circle cx="950" cy="180" r="160" fill="none" stroke="rgba(26, 115, 232, 0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="950" cy="180" r="90" fill="none" stroke="rgba(0, 201, 167, 0.4)" stroke-width="1.5"/>
  <circle cx="1040" cy="180" r="6" fill="#00c9a7"/>

  <!-- Outer Neon Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="rgba(0, 201, 167, 0.3)" stroke-width="1.5"/>
  <rect x="30" y="30" width="1140" height="5" fill="url(#tealGrad)"/>

  <!-- Unindexed Watermark / QR Gateway Badge -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="310" height="34" rx="8" fill="rgba(0, 201, 167, 0.12)" stroke="rgba(0, 201, 167, 0.4)" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#00c9a7"/>
    <text x="34" y="22" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00c9a7" letter-spacing="1.5">
      QR GATEWAY · UNINDEXED DEFAULT
    </text>
  </g>

  <!-- Confidential & Security Stamp -->
  <g transform="translate(900, 75)">
    <rect x="0" y="0" width="240" height="34" rx="8" fill="rgba(244, 166, 35, 0.12)" stroke="rgba(244, 166, 35, 0.4)" stroke-width="1"/>
    <text x="24" y="22" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#f4a623" letter-spacing="1">
      INTERNAL REPOSITORY
    </text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(60, 190)">
    <!-- Subtitle pill -->
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="14" font-weight="600" fill="#00c9a7" letter-spacing="3">
      OFFICIAL CORPORATE IDENTITY &amp; PUBLICATION PORTAL
    </text>

    <!-- Main Title -->
    <text x="0" y="65" font-family="'Arial Black', sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="2">
      SPATIOCORE TECH
    </text>

    <!-- Tagline -->
    <text x="0" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      Where Earth Data Meets Smart Solutions
    </text>

    <text x="0" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#cbd5e1" max-width="600">
      Verified Geospatial Directory · Satellite Remote Sensing · Official Brochures · Executive Cards
    </text>
  </g>

  <!-- Document Card Showcase on the right -->
  <g transform="translate(730, 210)">
    <!-- Document Card 1: Official Brochure -->
    <rect x="0" y="0" width="410" height="260" rx="18" fill="rgba(17, 24, 39, 0.9)" stroke="rgba(0, 201, 167, 0.5)" stroke-width="2"/>
    <rect x="0" y="0" width="8" height="260" rx="4" fill="#00c9a7"/>
    
    <!-- Top badge -->
    <rect x="25" y="20" width="130" height="24" rx="6" fill="rgba(0, 201, 167, 0.15)"/>
    <text x="35" y="36" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#00c9a7" letter-spacing="1">
      OFFICIAL PDF 2026
    </text>

    <text x="170" y="36" font-family="'Courier New', monospace" font-size="10" fill="#64748b">
      REF: OfficialPDF/brochures
    </text>

    <!-- Title inside card -->
    <text x="25" y="80" font-family="'Arial Black', sans-serif" font-size="18" font-weight="bold" fill="#ffffff">
      Corporate Capabilities &amp; GIS
    </text>
    <text x="25" y="105" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">
      SpatioCore_Corporate_Brochure_2026.pdf
    </text>

    <!-- Mini Specs -->
    <rect x="25" y="130" width="360" height="42" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(51, 65, 85, 0.6)" stroke-width="1"/>
    <text x="40" y="156" font-family="'Courier New', monospace" font-size="11" fill="#cbd5e1">
      SIZE: <tspan fill="#00c9a7" font-weight="bold">6.4 MB</tspan>   PAGES: <tspan fill="#00c9a7" font-weight="bold">28</tspan>   STATUS: <tspan fill="#00c9a7" font-weight="bold">ACTIVE</tspan>
    </text>

    <!-- Action indicator inside card -->
    <rect x="25" y="195" width="360" height="42" rx="10" fill="url(#tealGrad)"/>
    <text x="140" y="222" font-family="'Arial Black', sans-serif" font-size="13" font-weight="bold" fill="#0a0f1e" letter-spacing="1">
      VIEW PDF IN BROWSER
    </text>
  </g>

  <!-- Bottom Coordinates & Verification Details -->
  <g transform="translate(60, 560)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="11" fill="#64748b" letter-spacing="1">
      GEOLOCATION: 33.6844° N, 73.0479° E  |  SECURITY: SHA-256 VERIFIED  |  NO-INDEX INTERNAL LANDER
    </text>
    <text x="830" y="0" font-family="'Courier New', monospace" font-size="11" fill="#00c9a7" letter-spacing="1">
      © 2026 SPATIOCORE TECH
    </text>
  </g>
</svg>
